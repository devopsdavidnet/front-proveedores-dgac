<strong>Documentos subidos y verificados</strong>
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

-->
  <!-- Columna Nombre Archivo -->

  <ng-container matColumnDef="nombreArchivo">
    <th mat-header-cell *matHeaderCellDef>Nombre Archivo</th>
    <td mat-cell *matCellDef="let element">{{ element.nombreArchivo }}</td>
  </ng-container>

  <!-- Columna Fecha -->
  <ng-container matColumnDef="fechaCreacion">
    <th mat-header-cell *matHeaderCellDef>Fecha de Creación</th>
    <td mat-cell *matCellDef="let element">
      {{ element.fechaCreacion | date : "dd/MM/yyyy HH:mm" }}
    </td>
  </ng-container>

  <!-- Columna Acciones -->
  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let element">
      <button mat-stroked-button color="accent" (click)="verDocumento(element)">
        Ver
      </button>
    </td>
  </ng-container>

  <!-- Header y filas -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
