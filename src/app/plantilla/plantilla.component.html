<mat-toolbar class="dgac-bg">
  <button mat-icon-button aria-label="Menu icon" (click)="toggleMenu()">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="toolbar-title">Registro de Proveedores</span>
  <a *ngIf="valor === 3 || valor === 4 || valor === 5" class="usuario-info">
    <span class="entry">
      <span>Usuario: {{ nombre }}</span>
    </span>
  </a>
</mat-toolbar>
<mat-sidenav-container autosize>
  <mat-sidenav
    [ngClass]="!isCollapsed ? 'expanded' : ''"
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="isMobile ? 'false' : 'true'"
  >
    <mat-nav-list>
      <a mat-list-item routerLink="/home" (click)="closeSidenav()">
        <span class="entry">
          <img src="assets/images/home.png" class="menu-icon" alt="Home" />
          <span *ngIf="!isCollapsed">Inicio</span>
        </span>
      </a>

      <a
        *ngIf="valor === 2"
        mat-list-item
        routerLink="/register"
        (click)="closeSidenav()"
      >
        <span class="entry">
          <img src="assets/images/register.png" class="menu-icon" />
          <span *ngIf="!isCollapsed">Registrar</span>
        </span>
      </a>

      <a
        *ngIf="valor === 2"
        mat-list-item
        routerLink="/document"
        (click)="closeSidenav()"
      >
        <span class="entry">
          <img src="assets/images/acrobat.png" class="menu-icon" />
          <span *ngIf="!isCollapsed">Documentos</span>
        </span>
      </a>

      <a
        *ngIf="valor === 3 || valor === 4 || valor === 5"
        mat-list-item
        routerLink="/documentOrganization"
        (click)="closeSidenav()"
      >
        <span class="entry">
          <img src="assets/images/acrobat.png" class="menu-icon" />
          <span *ngIf="!isCollapsed">Ver Documentos</span>
        </span>
      </a>

      <a
        *ngIf="valor === 1"
        mat-list-item
        routerLink="/admin"
        (click)="closeSidenav()"
      >
        <span class="entry">
          <img src="assets/images/administrator.png" class="menu-icon" />
          <span *ngIf="!isCollapsed">Gestión de Usuarios</span>
        </span>
      </a>
      <a
        *ngIf="valor === 1"
        mat-list-item
        routerLink="/organizacion"
        (click)="closeSidenav()"
      >
        <span class="entry">
          <img src="assets/images/organizational.png" class="menu-icon" />
          <span *ngIf="!isCollapsed">Datos Organización</span>
        </span>
      </a>

      <a
        *ngIf="valor === 1"
        mat-list-item
        routerLink="/busqueda"
        (click)="closeSidenav()"
      >
        <span class="entry">
          <img src="assets/images/find_file.png" class="menu-icon" />
          <span *ngIf="!isCollapsed">Búsqueda de datos</span>
        </span>
      </a>

      <a mat-list-item routerLink="/" (click)="closeSidenav()">
        <span class="entry">
          <img src="assets/images/sign_out.png" class="menu-icon" />
          <span *ngIf="!isCollapsed">Cerrar Sesion</span>
        </span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
