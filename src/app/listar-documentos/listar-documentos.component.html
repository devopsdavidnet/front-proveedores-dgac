<div class="dialog-header">
  <span class="dialog-title">Lista de Documentos</span>
  <button mat-icon-button (click)="cerrar()" aria-label="Cerrar diálogo">
    <mat-icon>close</mat-icon>
  </button>
</div>

<strong>Documentos subidos y verificados</strong>
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <!-- Columna Organización 
  <ng-container matColumnDef="organizacion">
    <th mat-header-cell *matHeaderCellDef>Organización</th>
    <td mat-cell *matCellDef="let element">
      {{ element.organizacion?.nombre }}
    </td>
  </ng-container>
-->

  <ng-container matColumnDef="nombreArchivo">
    <th mat-header-cell *matHeaderCellDef>Nombre Archivo</th>
    <td mat-cell *matCellDef="let element">{{ element.nombreArchivo }}</td>
  </ng-container>

  <ng-container matColumnDef="fechaCreacion">
    <th mat-header-cell *matHeaderCellDef>Fecha de Creación</th>
    <td mat-cell *matCellDef="let element">
      {{ element.fechaCreacion | date : "dd/MM/yyyy HH:mm" }}
    </td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let element">
      <button
        mat-stroked-button
        color="accent"
        (click)="verDocumento(element.id)"
      >
        Ver
      </button>
    </td>
  </ng-container>

  <!-- Header y filas -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
