<strong> Documentos subidos y verificados </strong>
<table mat-table [dataSource]="dataSource">
  <!--nombre de archivo -->
  <ng-container matColumnDef="nombreArchivo">
    <th mat-header-cell *matHeaderCellDef>Nombre Archivo</th>
    <td mat-cell *matCellDef="let element">{{ element.nombreArchivo }}</td>
  </ng-container>

  <ng-container matColumnDef="fechaCreacion">
    <th mat-header-cell *matHeaderCellDef>Fecha de Creación</th>
    <td mall-cell *matCellDef="let element">
      {{ element.fechaCreacion | date : "dd/MM/yyyy HH:mm" }}
    </td>
  </ng-container>
  <ng-container matColumnDef="accion">
    <th mat-header-cell *matHeaderCellDef>Acción</th>
    <td mat-cell *matCellDef="let element">
      <button mat-stroked-button color="accent">Ver</button>
    </td>
  </ng-container>
  <!-- Header y filas -->
  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>
